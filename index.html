<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV - Micael Samuel</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ========================================
         1. ETIQUETA DE PROYECTO EN DESARROLLO
         ======================================== -->

    <div id="wip">
        WIP · WORK IN PROGRESS
    </div>

    <!-- ========================================
         3. MENÚ PRINCIPAL
         ======================================== -->

    <main id="inicio" class="pantalla">

        <div class="contenido-inicio">

            <p class="etiqueta-seccion">EXPEDIENTE PERSONAL</p>

            <h1>CV - Micael Samuel</h1>

            <p>Explora, descubre y conoce mi historia.</p>

            <button id="entrar" class="boton-principal">
                Entrar
            </button>

            <!-- Se desbloquea al encontrar el currículum -->
            <button id="ver-cv" class="oculta">
                Consultar currículum
            </button>

        </div>

    </main>


    <!-- ========================================
         4. ZONA DE EXPLORACIÓN
         ======================================== -->

    <main id="exploracion" class="pantalla oculta">

        <!-- CABECERA DE EXPLORACIÓN -->

        <header class="cabecera-exploracion">

            <button id="volver-menu" class="boton-menu">
                ← Menú principal
            </button>

            <h1>La cabaña</h1>

            <button id="abrir-inventario">
                Inventario
            </button>

        </header>


        <!-- ========================================
         RANURA DEL OBJETO EQUIPADO
         ======================================== -->

        <div id="contenedor-equipamiento">

            <button id="ranura-equipada" type="button" data-tooltip="Sin objeto equipado" aria-label="Abrir inventario">

                <span id="icono-ranura">＋</span>

            </button>

            <div id="menu-equipamiento" class="oculta">

                <button id="sustituir-equipamiento" type="button">
                    Sustituir objeto
                </button>

            </div>

        </div>


        <!-- ESCENA PRINCIPAL -->

        <section id="escena">

            <!-- Botón para salir de vistas ampliadas -->
            <button id="volver" class="oculta">
                ← Volver
            </button>

            <!-- Objetos y zonas interactivas -->
            <div id="zonas-interactivas">

                <!-- Documento inicial -->
                <button id="poster-cv" class="objeto-escena">
                    📜 Póster misterioso
                </button>

                <!-- Llaves de la cabaña -->
                <button id="llave-hierro" class="objeto-escena">
                    🗝️ Llave de hierro
                </button>

                <button id="llave-laton" class="objeto-escena">
                    🗝️ Llave de latón
                </button>

                <!-- Mecanismo cerrado -->
                <button id="cajon-laton" class="objeto-escena">
                    🗄️ Cajón con cerradura de latón
                </button>

                <button id="pieza-cv-1-3" class="objeto-escena oculta">
                    📄 Pieza de CV 1/3
                </button>

                <!-- Mensajes de interacción -->
                <p id="mensaje-escena" role="status" aria-live="polite"></p>

            </div>

        </section>


        <!-- ========================================
             5. INVENTARIO DEL JUGADOR
             ======================================== -->

        <aside id="inventario" class="oculta">

            <!-- CABECERA DEL INVENTARIO -->

            <div id="cabecera-inventario">

                <h2>Inventario</h2>

                <button id="cerrar-inventario" class="boton-cerrar">
                    Cerrar ×
                </button>

            </div>


            <!-- CONTADOR DE EXPLORACIÓN -->

            <p id="progreso">
                Exploración: 0 objetos encontrados
            </p>


            <!-- LISTA DE OBJETOS -->

            <div id="lista-objetos"></div>


            <!-- FICHA DEL OBJETO SELECCIONADO -->

            <div id="detalle-objeto">

                <h3 id="nombre-objeto">
                    Selecciona un objeto
                </h3>

                <p id="descripcion-objeto">
                    Aquí aparecerá la información del objeto.
                </p>

                <div id="acciones-objeto"></div>

            </div>

        </aside>

    </main>


    <!-- ========================================
         6. PANEL DEL CURRÍCULUM
         ======================================== -->

    <section id="panel-cv" class="oculta">

        <div id="cabecera-cv">

            <h2>Mi currículum</h2>

            <button id="cerrar-cv" class="boton-cerrar">
                Cerrar ×
            </button>

        </div>

        <div id="contenido-cv">

            <p>Formación, experiencia y competencias.</p>

            <!--
                FUTURO:
                Aquí incorporaremos las piezas del currículum.
                Cada pieza podrá desbloquear una sección
                de la trayectoria personal y profesional.
            -->

        </div>

    </section>


    <!-- ========================================
         7. CARGA DE JAVASCRIPT
         ======================================== -->

    <script src="js/inventory.js"></script>
    <script src="js/puzzles.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
